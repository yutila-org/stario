name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Gradle Build
        run: ./gradlew build

  detekt:
    name: Detekt Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Detekt CLI
        run: |
          DETEKT_VERSION="1.23.8"
          curl -sSLO "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          unzip "detekt-cli-${DETEKT_VERSION}.zip"
          chmod +x "detekt-cli-${DETEKT_VERSION}/bin/detekt-cli"
          echo "detekt-cli-${DETEKT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Run Detekt
        run: |
          detekt-cli \
            --input app/src,hidden/src \
            --report txt:detekt-report.txt \
            --report xml:detekt-report.xml

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: detekt-report
          path: |
            detekt-report.txt
            detekt-report.xml

  trivy:
    name: SAST & File System Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Architecture
        uses: actions/checkout@v4

      - name: Execute Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  secret-scan:
    name: Secret Entropy Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Architecture
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo install gitleaks /usr/local/bin/

      - name: Execute Gitleaks
        run: gitleaks detect --verbose --redact

  sbom:
    name: Software Bill of Materials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Architecture
        uses: actions/checkout@v4

      - name: Execute Syft
        uses: anchore/sbom-action@v0
        with:
          format: 'spdx-json'
          output-file: 'sbom-results.json'
