name: detekt

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  detekt:
    name: Detekt Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Detekt CLI
        run: |
          DETEKT_VERSION="1.23.8"
          curl -sSLO "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          unzip "detekt-cli-${DETEKT_VERSION}.zip"
          chmod +x "detekt-cli-${DETEKT_VERSION}/bin/detekt-cli"
          echo "detekt-cli-${DETEKT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Run Detekt
        run: |
          detekt-cli \
            --input app/src,hidden/src \
            --report txt:detekt-report.txt \
            --report xml:detekt-report.xml

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: detekt-report
          path: |
            detekt-report.txt
            detekt-report.xml
